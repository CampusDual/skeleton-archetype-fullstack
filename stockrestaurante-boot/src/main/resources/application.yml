spring:
  application:
    name: stock-restaurante
  datasource:
    url: jdbc:hsqldb:mem:stockdb;sql.syntax_pgs=true
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  packages-to-scan: com.campusdual.stockrestaurante.ws.controller
  paths-to-match: /api/**
  swagger-ui:
    urls:
      - name: "1. Automática (springdocs)"
        url: "/v3/api-docs"
      - name: "2. Manual (Copilot)"
        url: "/openapi-copilot.yaml"
