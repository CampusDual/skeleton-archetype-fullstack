name: Deploy Campus Dual fullstack archetype

on:
  workflow_dispatch:
    inputs:
      custom-version:
        type: string
        description: 'Optional. Specific release version to publish (e.g., 1.0.0).'
        required: false

jobs:
  deploy-snapshot:
    name: Deploy Snapshot Archetype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup xmlstarlet
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Build and deploy snapshot archetype
        uses: ./.github/actions/build-deploy-archetype
        with:
          version: '99.9.9-SNAPSHOT'
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          maven-gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  deploy-custom-release:
    name: Deploy Custom Release Archetype
    needs: deploy-snapshot
    if: "${{ github.event.inputs.custom-version != '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup xmlstarlet
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Build and deploy custom release archetype
        uses: ./.github/actions/build-deploy-archetype
        with:
          version: ${{ github.event.inputs.custom-version }}
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          maven-gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Test generation from local catalog
        run: |
          cd target/generated-sources/archetype
          mvn -B install archetype:update-local-catalog
          cd /tmp
          mvn -B archetype:generate \
            -DarchetypeCatalog=local \
            -DarchetypeGroupId=com.campusdual \
            -DarchetypeArtifactId=skeleton-fullstack-archetype \
            -DarchetypeVersion=${{ github.event.inputs.custom-version }} \
            -DgroupId=com.campusdual \
            -DartifactId=fullstacktest \
            -Dversion=1.0.0-SNAPSHOT \
            -Dpackage=com.campusdual.fullstacktest \
            -DinteractiveMode=false

      - name: Upload fullstack project ready for Windows
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-${{ github.event.inputs.custom-version }}
          path: /tmp/fullstacktest
          include-hidden-files: true
          retention-days: 1