          type: string
          maxLength: 80
          minLength: 0
        password:
          type: string
          maxLength: 120
          minLength: 8
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
      required:
      - enabled
      - password
      - roles
      - username
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
